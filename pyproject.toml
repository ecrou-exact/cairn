[project]
name = "cairn"
version = "0.1.0"
description = "Self-hosted workspace for open-source developers: plan tasks, see them as a graph, run coding agents in parallel, manage GitHub and local instances."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.1",
    "flask-login>=0.6.3",
    "flask-wtf>=1.2",
    "flask-limiter>=3.12",
    "sqlalchemy>=2.0.40",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "segno>=1.6",
    "cryptography>=44",
    "keyring>=25",
    "platformdirs>=4.3",
    "pydantic>=2.11",
    "python-dotenv>=1.1",
    "psutil>=7.0",
    "waitress>=3.0",
    "gunicorn>=23 ; sys_platform != 'win32'",
    "pillow>=11",
    "anthropic>=1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
    "bandit>=1.8",
    "pip-audit>=2.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
# RUF001-003: typographic characters (– × −) are intended in UI text and docstrings.
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
